---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copperforge
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: copperforge
          image: copperforge
          ports:
            - containerPort: 8080
          env:
            - name: APP_ORIGIN
              value: https://copperforge.cindergla.de
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copperforge-database-secret
                  key: password
            # $(POSTGRES_PASSWORD) is expanded by kubelet from the env entry
            # above, so the password stays in the sealed secret only.
            - name: DATABASE_URL
              value: postgres://copperforge:$(POSTGRES_PASSWORD)@copperforge-db-rw:5432/copperforge?sslmode=require
          envFrom:
            - secretRef:
                name: copperforge-admin-secret
      imagePullSecrets:
        - name: copperforge-ghcr-pull-secret
