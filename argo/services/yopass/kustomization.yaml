apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yopass

labels:
- pairs:
    environment: homelab
- includeSelectors: true
  pairs:
    app: yopass

resources:
- deployment.yaml
- service.yaml
- ingress.yaml

images:
- name: yopass
  newName: jhaals/yopass
  newTag: 15.0.0
- name: memcached
  newTag: 1.6.45-alpine
