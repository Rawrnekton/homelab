apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextcloud

labels:
- pairs:
    environment: homelab
- includeSelectors: true
  pairs:
    app: nextcloud

resources:
- database.yaml
- ingress.yaml
- pvc.yaml
- valkey.yaml
- cnpg-object-store.yaml
- cnpg-scheduled-backup.yaml
- sealed-secrets/nextcloud-nextcloud-admin-sealed.yaml
- sealed-secrets/nextcloud-nextcloud-database-secret-sealed.yaml
- sealed-secrets/nextcloud-nextcloud-authentik-oidc-credentials-sealed.yaml
- cnpg-garage-credentials-sealed.yaml

images:
- name: valkey
  newName: valkey/valkey
  newTag: 9.1.3-alpine
- name: busybox
  newTag: "1.38"

helmCharts:
- name: nextcloud
  namespace: nextcloud
  releaseName: nextcloud
  repo: https://nextcloud.github.io/helm/
  version: 9.4.3
  valuesInline:
    podAnnotations:
      # config.php (instance secrets) and custom_apps, the data dir is on iSCSI
      backup.velero.io/backup-volumes: nextcloud-main

    nextcloud:
      host: cloud.cindergla.de
      existingSecret:
        enabled: true
        secretName: nextcloud-admin
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password

      extraEnv:
        - name: OVERWRITEPROTOCOL
          value: https
        - name: OVERWRITECLIURL
          value: https://cloud.cindergla.de
        # pod network, traefik connects from here
        - name: TRUSTED_PROXIES
          value: 10.42.0.0/16
        - name: PHP_UPLOAD_LIMIT
          value: 16G
        - name: PHP_MEMORY_LIMIT
          value: 1G
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: nextcloud-authentik-oidc-credentials
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-authentik-oidc-credentials
              key: OIDC_CLIENT_SECRET

      configs:
        homelab.config.php: |-
          <?php
          $CONFIG = array (
            'default_phone_region' => 'DE',
            'maintenance_window_start' => 1,
            // auth.cindergla.de resolves to the gateway (192.168.2.170) inside the LAN,
            // without this user_oidc cannot reach Authentik
            'allow_local_remote_servers' => true,
          );

      hooks:
        # runs at each start, user_oidc:provider creates or updates the provider
        # nextcloud_groups comes from the Authentik scope mapping "nextcloud" and holds
        # "admin" for members of "nextcloud Admins"; the whitelist keeps all other
        # Nextcloud groups out of the sync, so they can be managed in Nextcloud
        before-starting: |-
          #!/bin/sh
          occ() { php /var/www/html/occ "$@"; }
          occ app:install user_oidc || occ app:enable user_oidc \
            || echo "WARNING: user_oidc not installed, SSO is not available"
          occ user_oidc:provider authentik \
            --clientid="$OIDC_CLIENT_ID" \
            --clientsecret="$OIDC_CLIENT_SECRET" \
            --discoveryuri="https://auth.cindergla.de/application/o/nextcloud/.well-known/openid-configuration" \
            --scope="openid email profile nextcloud" \
            --unique-uid=0 \
            --mapping-uid=preferred_username \
            --mapping-display-name=name \
            --mapping-email=email \
            --group-provisioning=1 \
            --mapping-groups=nextcloud_groups \
            --group-whitelist-regex='/^admin$/' \
            || echo "WARNING: user_oidc provider authentik not configured"

      # the data subPath on the iSCSI volume is made by the kubelet as root
      extraInitContainers:
        - name: data-permissions
          image: busybox
          command: ["sh", "-c", "chown 33:33 /data && chmod 0770 /data"]
          volumeMounts:
            - name: nextcloud-data
              mountPath: /data
              subPath: data

    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: nextcloud-db-rw
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-database-secret
        usernameKey: username
        passwordKey: password

    externalRedis:
      enabled: true
      host: nextcloud-valkey
      port: "6379"

    cronjob:
      enabled: true
      type: sidecar

    persistence:
      enabled: true
      storageClass: longhorn
      size: 8Gi
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data-iscsi

    startupProbe:
      enabled: true
