---
# cache and file locking only, no persistence needed
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      component: valkey
  template:
    metadata:
      labels:
        component: valkey
    spec:
      containers:
        - name: valkey
          image: valkey
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-valkey
spec:
  selector:
    component: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
