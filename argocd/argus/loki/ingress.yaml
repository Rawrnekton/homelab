---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: loki-push-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - loki.cindergla.de
      secretName: loki-tls
  rules:
    - host: loki.cindergla.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100
