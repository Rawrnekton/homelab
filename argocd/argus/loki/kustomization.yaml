---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loki

resources:
  - ingress.yaml
  - middleware.yaml
  - loki-garage-credentials-sealed.yaml
  - push-auth-htpasswd-sealed.yaml

helmCharts:
  - name: loki
    namespace: loki
    releaseName: loki
    repo: https://grafana.github.io/helm-charts
    version: 7.6.0
    valuesInline:
      deploymentMode: SingleBinary
      loki:
        auth_enabled: false
        analytics:
          reporting_enabled: false
        commonConfig:
          replication_factor: 1
        schemaConfig:
          configs:
            - from: "2026-10-01"
              store: tsdb
              object_store: s3
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
        storage:
          type: s3
          bucketNames:
            chunks: loki-chunks
            ruler: loki-ruler
          s3:
            endpoint: http://garage.garage.svc.cluster.local:3900
            region: garage
            # Loki expands these from loki-garage-credentials, see extraArgs.
            accessKeyId: ${GARAGE_ACCESS_KEY_ID}
            secretAccessKey: ${GARAGE_SECRET_ACCESS_KEY}
            s3ForcePathStyle: true
            insecure: true
        limits_config:
          retention_period: 30d
        compactor:
          retention_enabled: true
          delete_request_store: s3
      singleBinary:
        replicas: 1
        extraArgs:
          - -config.expand-env=true
        extraEnvFrom:
          - secretRef:
              name: loki-garage-credentials
        persistence:
          storageClass: longhorn
          size: 10Gi
      read:
        replicas: 0
      write:
        replicas: 0
      backend:
        replicas: 0
      gateway:
        enabled: false
      # Memcached needs more memory than argus has free.
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false
      lokiCanary:
        enabled: false
      test:
        enabled: false
