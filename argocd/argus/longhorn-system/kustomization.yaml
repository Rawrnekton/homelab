---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: longhorn
    namespace: longhorn-system
    releaseName: longhorn
    repo: https://charts.longhorn.io
    version: 1.13.0
    includeCRDs: true
    valuesInline:
      # argus is a single node. More than one replica stays degraded.
      persistence:
        defaultClass: true
        defaultClassReplicaCount: 1
        reclaimPolicy: Retain
      defaultSettings:
        defaultReplicaCount: '{"v1":"1","v2":"1"}'
        # The lvm role mounts this path from the NVMe.
        defaultDataPath: /var/lib/longhorn
        # The LV holds only Longhorn data. Longhorn uses this value only when it
        # creates the default disk (first sync); later, change it on the node.
        storageReservedPercentageForDefaultDisk: 0
        # No Longhorn snapshots on argus: backups only go through Velero (file
        # system backup).
        storageMinimalAvailablePercentage: 5
        # Same as the default. The volume sizes cannot be more than the disk.
        storageOverProvisioningPercentage: 100
      # The chart says to disable this job with Argo CD.
      preUpgradeChecker:
        jobEnabled: false
      csi:
        attacherReplicaCount: 1
        provisionerReplicaCount: 1
        resizerReplicaCount: 1
        snapshotterReplicaCount: 1
      longhornGlobalManager:
        replicas: 1
      longhornUI:
        replicas: 1
