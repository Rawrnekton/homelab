metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# SQLite stays consistent after a power loss. LMDB can break.
db_engine = "sqlite"
metadata_fsync = true
metadata_auto_snapshot_interval = "24h"

# argus is a single node.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Loki and Mimir use this value as the S3 region.
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
