---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: garage

labels:
  - includeSelectors: true
    pairs:
      app: garage

resources:
  - garage-secrets-sealed.yaml
  # S3 keys of Loki and Mimir, for the bootstrap Job.
  - garage-bootstrap-keys-sealed.yaml
  - statefulset.yaml
  - service.yaml
  - bootstrap-job.yaml

configMapGenerator:
  - name: garage-config
    files:
      - garage.toml
  - name: garage-bootstrap
    files:
      - bootstrap.sh

images:
  - name: garage
    newName: dxflrs/garage
    newTag: v2.5.0
