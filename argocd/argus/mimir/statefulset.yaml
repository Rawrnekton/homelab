---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
spec:
  serviceName: mimir
  replicas: 1
  template:
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: mimir
          image: mimir
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -config.expand-env=true
          # GARAGE_ACCESS_KEY_ID, GARAGE_SECRET_ACCESS_KEY.
          envFrom:
            - secretRef:
                name: mimir-garage-credentials
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9095
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: mimir-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
