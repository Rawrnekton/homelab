---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mimir
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: mimir-push-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mimir.cindergla.de
      secretName: mimir-tls
  rules:
    - host: mimir.cindergla.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mimir
                port:
                  number: 8080
