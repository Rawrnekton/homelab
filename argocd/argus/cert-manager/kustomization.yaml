---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: cert-manager
    namespace: cert-manager
    releaseName: cert-manager
    repo: https://charts.jetstack.io
    version: v1.21.3
    valuesInline:
      # The chart has the CRDs in its templates, not in crds/. Thus
      # includeCRDs has no effect; this value installs them.
      crds:
        enabled: true
        # Helm does not delete the CRDs (and all Certificates) on uninstall.
        keep: true

  # DNS-01 solver for the netcup DNS.
  - name: cert-manager-webhook-netcup
    namespace: cert-manager
    releaseName: webhook-netcup
    repo: oci://ghcr.io/aellwein/cert-manager-webhook-netcup
    version: 1.1.3
    valuesInline:
      # The ClusterIssuer refers to this name (webhook.groupName).
      groupName: com.netcup.webhook

resources:
  # Credentials for the netcup DNS API. The webhook reads them at each challenge.
  - netcup-secret-sealed.yaml
