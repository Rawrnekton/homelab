---
# forward auth to the embedded authentik outpost (proxy provider, single application).
# The outpost path /outpost.goauthentik.io on focus.cindergla.de goes to authentik,
# see argocd/olympus/infra/authentik/outpost-ingress-focus.yml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
