---
# The smoke test of the role. It only reads, and it is safe on a cluster that
# runs. When a node joins, the full role runs again on the nodes that work
# already.
- name: Read the state of the k3s unit
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
  register: k3s_verify_unit

- name: Assert the k3s unit is enabled and running
  ansible.builtin.assert:
    that:
      - k3s_verify_unit.status.ActiveState == 'active'
      - k3s_verify_unit.status.UnitFileState == 'enabled'
    fail_msg: >-
      {{ k3s_service_name }} is {{ k3s_verify_unit.status.ActiveState }} and {{
      k3s_verify_unit.status.UnitFileState }} on this node. It must be active
      and enabled.

- name: Assert the API server reports ready
  # tasks/install.yml tells why this is `k3s kubectl` and not a plain request to
  # /readyz.
  ansible.builtin.command: k3s kubectl get --raw /readyz
  register: k3s_verify_readyz
  changed_when: false
  until: k3s_verify_readyz is success
  retries: 30
  delay: 10
  when: k3s_node_role == 'control'

# kubectl through `command`: kubernetes.core needs the python kubernetes client
# on the target, and this role does not install it.
#
# Two waits, not one, because the two failures have different causes. A node
# that does not register has a problem with the token, the address or the
# firewall. A node that registers but stays NotReady has a CNI problem.
- name: Count the nodes that registered with the cluster
  ansible.builtin.command: k3s kubectl get nodes --no-headers
  register: k3s_verify_nodes
  changed_when: false
  delegate_to: "{{ k3s_first_control_node }}"
  run_once: true
  until: k3s_verify_nodes.stdout_lines | length >= ansible_play_hosts | length
  retries: 30
  delay: 10

- name: Assert every node of the play joined the cluster
  ansible.builtin.assert:
    that:
      - k3s_verify_nodes.stdout_lines | length >= ansible_play_hosts | length
    fail_msg: >-
      The play holds {{ ansible_play_hosts | length }} nodes, but only {{
      k3s_verify_nodes.stdout_lines | length }} registered with the cluster: {{
      k3s_verify_nodes.stdout }}
  run_once: true

# A node is Ready when the kubelet finds a CNI that works. With flannel, this
# occurs some seconds after the join. With Cilium, the DaemonSet must start on
# the node first. tasks/cilium.yml waited for it on the bootstrap node already.
- name: Wait for every node of the play to report Ready
  ansible.builtin.command: k3s kubectl get nodes --no-headers
  register: k3s_verify_ready
  changed_when: false
  delegate_to: "{{ k3s_first_control_node }}"
  run_once: true
  until:
    - k3s_verify_ready.stdout_lines | length >= ansible_play_hosts | length
    - "'NotReady' not in k3s_verify_ready.stdout"
  retries: 30
  delay: 10
  # A retry loop that uses all attempts causes the task to fail, whatever
  # failed_when says. Thus the task ignores the error, and the assert below can
  # report the real problem and not "Timeout".
  ignore_errors: true

- name: Assert every node of the play is Ready
  ansible.builtin.assert:
    that:
      - "'NotReady' not in k3s_verify_ready.stdout"
    fail_msg: >-
      A node registered with the cluster but never became Ready. That is the
      CNI: {{ 'Cilium is the CNI here, so look at the cilium DaemonSet in
      kube-system' if k3s_cni == 'cilium' else 'look at the flannel setup and at
      the kubelet log' }}. Nodes: {{ k3s_verify_ready.stdout }}
  run_once: true
