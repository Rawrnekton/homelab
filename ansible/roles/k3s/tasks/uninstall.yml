---
# Remove k3s from this node (k3s_state: absent).
#
# The install script writes an uninstall script next to the binary: one for a
# server, and a different one for an agent. These scripts know all paths of k3s,
# thus the role uses them and does not remove files itself. The scripts also
# remove themselves. Thus a second run does nothing.
- name: Look for the k3s uninstall scripts
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ item }}"
  register: k3s_uninstall_scripts
  loop:
    - k3s-uninstall.sh
    - k3s-agent-uninstall.sh

- name: Run the k3s uninstall scripts
  ansible.builtin.command:
    cmd: "{{ item.stat.path }}"
  loop: "{{ k3s_uninstall_scripts.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Remove the downloaded install script
  ansible.builtin.file:
    path: "{{ k3s_install_script }}"
    state: absent
