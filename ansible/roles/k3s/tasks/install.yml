---
# All nodes use this file: the bootstrap server, a joining server and an agent.
# The differences come from vars/main.yml (k3s_service_name, k3s_install_exec)
# and from config.yaml.j2. The template decides if this node starts the cluster
# or joins it.
#
# The order is important: the configuration must be on the disk before the
# install script runs, because the script starts k3s with it.
- name: Write the k3s configuration
  ansible.builtin.import_tasks: write-config.yml

# Cordon and drain only before an upgrade. After a configuration change, the
# handler restarts the node, but it does not drain it. A k3s restart is short,
# and a drain at each change moves all workloads two times for no reason.
#
# The first control node does the drain, because a worker has no API of its own.
- name: Cordon and drain this node before the upgrade
  ansible.builtin.command:
    cmd: >-
      k3s kubectl drain {{ k3s_node_name }} --ignore-daemonsets
      --delete-emptydir-data --force --timeout=120s
  delegate_to: "{{ k3s_first_control_node }}"
  changed_when: true
  throttle: 1
  when:
    - k3s_upgrade | bool
    - k3s_already_running | bool

- name: Run the k3s install script
  ansible.builtin.command:
    cmd: "{{ k3s_install_script }}"
  environment:
    # default(omit) removes the key from the environment of the child process.
    # The install script checks if the key is set.
    INSTALL_K3S_CHANNEL: "{{ k3s_release_channel | default(omit) }}"
    INSTALL_K3S_VERSION: "{{ k3s_version | default(omit) }}"
    INSTALL_K3S_SKIP_START: "true"
    INSTALL_K3S_EXEC: "{{ k3s_install_exec }}"
  when: not (k3s_already_running | bool) or k3s_upgrade
  changed_when: true

- name: Enable and start k3s
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

# `state: started` does not change a service that runs already. Thus an upgrade
# needs an explicit restart to use the new binary. The handler cannot do it: it
# runs at the end of the play, after the role upgraded the subsequent nodes too.
- name: Restart k3s onto the freshly installed version
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    state: restarted
  when:
    - k3s_upgrade | bool
    - k3s_already_running | bool

- name: Wait for the k3s API to report ready
  # kubectl through `command`, because k3s turns off anonymous authentication.
  # Thus /readyz gives 401 to a request without authentication. `k3s kubectl`
  # uses the kubeconfig of the node. kubernetes.core cannot help: it needs the
  # python kubernetes client on the target, and this role does not install it.
  ansible.builtin.command: k3s kubectl get --raw /readyz
  register: k3s_readyz
  changed_when: false
  until: k3s_readyz is success
  retries: 30
  delay: 10
  when: k3s_node_role == 'control'

- name: Uncordon this node after the upgrade
  ansible.builtin.command:
    cmd: k3s kubectl uncordon {{ k3s_node_name }}
  delegate_to: "{{ k3s_first_control_node }}"
  changed_when: true
  throttle: 1
  when:
    - k3s_upgrade | bool
    - k3s_already_running | bool
