---
# Each node does these steps before the k3s install, for all node roles.
- name: Make sure the k3s configuration directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s/
    state: directory
    mode: "0755"

- name: Set the required sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ k3s_sysctl_settings | dict2items }}"
  when: k3s_sysctl_settings is defined

# config.yaml on the servers turns on the embedded registry mirror. But a node
# uses the mirror only when containerd has a mirror entry. The agents also need
# this file, thus it is here and not in post-install.yml.
#
# The role manages the file only while k3s_spegel_enabled is true. The role does
# not remove the file, because the operator can have a registry configuration of
# their own in it.
- name: Write the containerd registry configuration
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0644"
  when: k3s_spegel_enabled | bool
  notify: k3s configuration changed

- name: Download the k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: "{{ k3s_install_script }}"
    mode: "0755"
  when: not (k3s_already_running | bool) or k3s_upgrade
