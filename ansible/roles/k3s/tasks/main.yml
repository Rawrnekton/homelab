---
- name: Validate variables
  ansible.builtin.import_tasks: validate-variables.yml

- name: Remove k3s from this node
  ansible.builtin.include_tasks: uninstall.yml
  when: k3s_state == 'absent'

- name: Run pre-flight checklist
  ansible.builtin.import_tasks: pre-flight-checklist.yml
  when: k3s_state == 'present'

- name: Run common tasks
  ansible.builtin.import_tasks: common.yml
  when: k3s_state == 'present'

# The bootstrap node must complete before the other nodes start, because they
# read its join token from its facts. Thus these are two includes and not one.
# Ansible completes an include on all hosts before it continues.
- name: Bootstrap the first control-plane node
  ansible.builtin.include_tasks: control-init.yml
  when:
    - k3s_state == 'present'
    - inventory_hostname == k3s_first_control_node

# Before the join, not after: a node that joins a cluster without a CNI stays
# NotReady. Also, the chart must be there before a workload starts.
- name: Install Cilium on the bootstrap node
  ansible.builtin.include_tasks: cilium.yml
  when:
    - k3s_state == 'present'
    - k3s_cni == 'cilium'
    - inventory_hostname == k3s_first_control_node

- name: Join the remaining nodes
  ansible.builtin.include_tasks: install.yml
  when:
    - k3s_state == 'present'
    - inventory_hostname != k3s_first_control_node

- name: Run post-install tasks
  ansible.builtin.include_tasks: post-install.yml
  when:
    - k3s_state == 'present'
    - inventory_hostname == k3s_first_control_node

# include_tasks, not import_tasks. verify.yml delegates a task to
# k3s_first_control_node, and Ansible renders `delegate_to` BEFORE it checks
# `when`. With an import, Ansible resolves the delegation also on the k3s_state:
# absent path. On that path, pre-flight did not run, and the fact does not
# exist. Ansible skips a dynamic include fully.
- name: Verify the installation
  ansible.builtin.include_tasks: verify.yml
  when: k3s_state == 'present'
