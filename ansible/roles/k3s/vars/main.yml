---
# Values that the role calculates itself. They are not for the user: k3s sets
# each value, or the role calculates it from the variables in defaults/main.yml.

# common.yml downloads the get.k3s.io script to this path.
k3s_install_script: /tmp/k3s-install.sh

# k3s applies each manifest in this directory when it starts. Thus the Cilium
# HelmChart CR gets to the API server without helm on the node.
k3s_manifests_dir: /var/lib/rancher/k3s/server/manifests

# The Cilium manifest. The same path with `.skip` at the end is the marker that
# tells k3s to ignore the manifest. See tasks/cilium.yml.
k3s_cilium_manifest: "{{ k3s_manifests_dir }}/cilium.yaml"

# The unit that the install script writes, and the sub-command that it runs.
# With INSTALL_K3S_EXEC=agent, the script writes k3s-agent.service and not
# k3s.service.
k3s_service_name: "{{ 'k3s' if k3s_node_role == 'control' else 'k3s-agent' }}"
k3s_install_exec: "{{ 'server' if k3s_node_role == 'control' else 'agent' }}"

# k3s uses the hostname in lowercase as the node name.
k3s_node_name: "{{ ansible_hostname | lower }}"

# config.yaml.j2 writes these config keys itself. The role removes a
# pass-through argument with one of these keys, so that the key is not in the
# file two times.
k3s_config_owned_keys:
  - cluster-init
  - server
  - token
  - snapshotter
  - write-kubeconfig-mode
  - embedded-registry
  - flannel-backend
  - disable-network-policy
  - disable-kube-proxy

# k3s accepts these config keys more than one time. config.yaml.j2 writes them
# as a YAML list. It merges the role variable with the pass-through arguments
# that have the same key.
k3s_config_list_keys:
  - node-label
  - node-taint
  - tls-san
  - kubelet-arg
  - disable
