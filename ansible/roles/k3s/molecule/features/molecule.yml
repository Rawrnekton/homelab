---
# Features scenario: one control-plane node with the whole per-node variable
# surface turned on at once.
#
# Goal: prove that each variable changes the state of the node, not only the
# rendered config. The verify playbook therefore reads the live node object,
# /proc and the fetched kubeconfig wherever it can, and falls back to
# config.yaml only where k3s gives no other evidence.
#
# k3s_tls_san is deliberately NOT set here. Its effect is a SAN on the API
# server certificate, so it belongs where a certificate is read - the `ha`
# scenario. What config.yaml.j2 renders for it is covered in `local`.
dependency:
  name: galaxy
role_name_check: 2
driver:
  name: docker
platforms:
  - name: k3s-features
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
  inventory:
    host_vars:
      k3s-features:
        k3s_node_role: control
        # overlayfs does not work nested inside Docker.
        k3s_snapshotter: native
        k3s_node_labels:
          - "molecule.test/from-list=true"
        # A NoSchedule taint on the only node keeps workloads Pending. That is
        # fine: the assertions below check that objects exist, not that pods run.
        k3s_node_taints:
          - "molecule.test/dedicated=testing:NoSchedule"
        k3s_kubelet_args:
          - max-pods=42
        # --node-label is a real k3s server flag, so the effect of a
        # pass-through argument is visible on the node object. The key differs
        # from the k3s_node_labels one, so the two sources stay distinguishable.
        k3s_extra_server_args:
          - "--node-label=molecule.test/from-server-args=true"
        k3s_kubeconfig_fetch: true
        k3s_kubeconfig_dest: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/fetched-kubeconfig.yaml"
        k3s_sysctl_settings:
          fs.inotify.max_user_instances: 512
          fs.inotify.max_user_watches: 524288
        k3s_local_path_provisioner_enabled: true
        k3s_spegel_enabled: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
