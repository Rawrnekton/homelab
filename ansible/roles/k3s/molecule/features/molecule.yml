---
# Features scenario: one control-plane node with all per-node variables on at
# the same time.
#
# Goal: show that each variable changes the state of the node, not only the
# rendered config. Thus the verify playbook reads the live node object, /proc
# and the fetched kubeconfig where possible. It reads config.yaml only where k3s
# gives no other evidence.
#
# k3s_tls_san is NOT set here. Its effect is a SAN on the API server
# certificate, thus it goes into a scenario that reads a certificate: `ha`.
# `local` tests what config.yaml.j2 renders for it.
dependency:
  name: galaxy
role_name_check: 2
driver:
  name: docker
platforms:
  - name: k3s-features
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
  inventory:
    host_vars:
      k3s-features:
        k3s_node_role: control
        # overlayfs does not work inside a Docker container.
        k3s_snapshotter: native
        k3s_node_labels:
          - "molecule.test/from-list=true"
        # A NoSchedule taint on the only node keeps workloads Pending. This is
        # correct: the assertions below check that objects exist, not that pods
        # run.
        k3s_node_taints:
          - "molecule.test/dedicated=testing:NoSchedule"
        k3s_kubelet_args:
          - max-pods=42
        # --node-label is a real k3s server flag. Thus the effect of a
        # pass-through argument shows on the node object. The key is not the
        # same as the k3s_node_labels key, so that the test can tell the two
        # sources apart.
        k3s_extra_server_args:
          - "--node-label=molecule.test/from-server-args=true"
        k3s_kubeconfig_fetch: true
        k3s_kubeconfig_dest:
          "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY')
          }}/fetched-kubeconfig.yaml"
        k3s_sysctl_settings:
          fs.inotify.max_user_instances: 512
          fs.inotify.max_user_watches: 524288
        k3s_local_path_provisioner_enabled: true
        k3s_spegel_enabled: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
