---
# All scenarios use this file through a symlink. molecule looks for
# collections.yml in the scenario directory, and it ignores a requirements-file
# option to a different path.
#
# The create and destroy playbooks of the docker driver
# (molecule_plugins.docker) need community.docker and ansible.posix. The role
# does not need them. community.crypto gives x509_certificate_info to the verify
# playbooks. With it, they read the API server SANs without a shell call to
# openssl. ansible.utils is a role dependency: tasks/validate-variables.yml uses
# ansible.utils.ipaddr on k3s_tls_san.
collections:
  - name: community.docker
    version: ">=3.10.2"
  - name: ansible.posix
    version: ">=1.4.0"
  - name: community.crypto
    version: ">=2.0.0"
  - name: ansible.utils
    version: ">=2.0.0"
