---
# Shared by every scenario through a symlink (molecule looks for
# collections.yml inside the scenario directory and ignores a
# requirements-file option pointing elsewhere).
#
# community.docker and ansible.posix are required by the docker driver's own
# create/destroy playbooks (molecule_plugins.docker), not by the role.
# community.crypto gives the verify playbooks x509_certificate_info, which is
# how they read the API server SANs without shelling out to openssl.
# ansible.utils is a role dependency: tasks/validate-variables.yml uses
# ansible.utils.ipaddr on k3s_tls_san.
collections:
  - name: community.docker
    version: ">=3.10.2"
  - name: ansible.posix
    version: ">=1.4.0"
  - name: community.crypto
    version: ">=2.0.0"
  - name: ansible.utils
    version: ">=2.0.0"
