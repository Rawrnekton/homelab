---
# Cilium scenario: one control-plane node with Cilium and not flannel.
#
# Goal: the deterministic parts of the CNI change. flannel and the built-in
# network policy are off, and kube-proxy is off. A HelmChart CR in the manifests
# directory has the requested chart version and Helm values. The HelmChart
# controller creates the Cilium DaemonSet.
#
# This scenario also checks the dataplane, and the platform block below is for
# that. Cilium needs kernel features that the other scenarios do not need:
#   - a PRIVATE cgroup namespace, not the one of the host. The Cilium
#     documentation asks for it. With the host namespace, the agent changes
#     the cgroup root of the machine that runs the tests.
#   - bpffs at /sys/fs/bpf, bind-mounted rshared, so that the mounts of the
#     agent propagate. The host must have it mounted and shared:
#       mount | grep /sys/fs/bpf     # bpf on /sys/fs/bpf type bpf
#       findmnt -o PROPAGATION /sys/fs/bpf     # shared
#   - /lib/modules, so that the agent can load the modules that it needs.
#   - a host kernel of 5.14 or later and cgroup v2 (unified). A current
#     Ubuntu has the two.
#
# Thus this is the only scenario that depends on the kernel of the host. It also
# downloads the chart from helm.cilium.io and the images from quay.io. Thus it
# needs the network, and it is the slowest of the ten scenarios.
dependency:
  name: galaxy
role_name_check: 2
driver:
  name: docker
platforms:
  - name: k3s-cilium
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: private
    # The entry point does two mounts before systemd starts, and then gives
    # control to systemd. kind does the same.
    #
    #   cgroup2 - the image declares /sys/fs/cgroup as a VOLUME. Thus Docker puts
    #     an anonymous ext4 volume there, and systemd finds no hierarchy. The
    #     container then stops with exit 255 and an empty log. The other
    #     scenarios bind-mount the cgroup tree of the host to prevent this. That
    #     needs cgroupns_mode: host, and Cilium must not have it. Here, the
    #     cgroup2 mount gives the container its own cgroup root.
    #   --make-rshared /run - Docker mounts the /run tmpfs as private. Then the
    #     cilium-agent container does not start: "path /var/run/netns is mounted
    #     on /run but it is not a shared or slave mount". systemd sets the
    #     propagation of / but not of /run, thus the entry point does it.
    command:
      '/bin/sh -c "mount -t cgroup2 none /sys/fs/cgroup && mount --make-rshared
      /run && exec /usr/lib/systemd/systemd"'
    volumes:
      # No /sys/fs/cgroup here: the entry point mounts it.
      - /sys/fs/bpf:/sys/fs/bpf:rshared
      # With this mount, kmod-static-nodes.service fails, and systemd is
      # "degraded". k3s needs nothing from that unit.
      - /lib/modules:/lib/modules:ro
    tmpfs:
      - /run
      - /run/lock
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
  inventory:
    host_vars:
      k3s-cilium:
        k3s_node_role: control
        k3s_snapshotter: native
        k3s_cni: cilium
        # Change this together with the homelab. It must be a published chart
        # version on https://helm.cilium.io. If not, the HelmChart controller
        # fails, and the DaemonSet assertion fails for the wrong reason.
        k3s_cilium_version: 1.20.1
        k3s_cilium_values:
          operator:
            replicas: 1
          # kube-proxy is off, thus the agent cannot get to the API through a
          # service IP. It uses the local API server.
          k8sServiceHost: 127.0.0.1
          k8sServicePort: 6443
          # The agent cannot mount cgroup2 itself in the node container. The
          # container has the hierarchy of the host at /sys/fs/cgroup already.
          cgroup:
            autoMount:
              enabled: false
            hostRoot: /sys/fs/cgroup
        k3s_kube_proxy_replacement: true
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
