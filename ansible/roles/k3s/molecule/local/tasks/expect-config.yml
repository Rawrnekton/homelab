---
# Render templates/config.yaml.j2 with the vars of the include, and check the
# result.
#
# Caller contract:
#   case_name     - name of the case for the report
#   case_contains - text that must be in the rendered file
#   case_absent   - text that must NOT be in it
#   case_keys     - key/value pairs that the parsed YAML must have
#   plus the k3s_* variables under test
#
# The record works the same as in expect-rejected.yml: a case does not cause the
# play to fail, and the report play at the end fails one time with the full
# table.
- name: "Case: {{ case_name }}"
  block:
    - name: "Parse the pass-through arguments: {{ case_name }}"
      ansible.builtin.include_role:
        name: k3s
        tasks_from: parse-extra-args.yml

    - name: "Render the configuration: {{ case_name }}"
      ansible.builtin.set_fact:
        rendered_config:
          "{{ lookup('ansible.builtin.template', k3s_config_template) }}"

    - name: "Check the rendered configuration: {{ case_name }}"
      vars:
        parsed: "{{ rendered_config | from_yaml | default({}, true) }}"
      ansible.builtin.assert:
        that:
          # Each wanted text is there ...
          - case_contains | default([]) | reject('in', rendered_config) | list |
            length == 0
          # ... no unwanted text is there ...
          - case_absent | default([]) | select('in', rendered_config) | list |
            length == 0
          # ... and the parsed YAML has each wanted key already, thus a merge of
          # them changes nothing.
          - parsed | combine(case_keys | default({})) == parsed

    - name: "Record that the configuration is right: {{ case_name }}"
      ansible.builtin.set_fact:
        case_outcome:
          name: "{{ case_name }}"
          ok: true
          detail: rendered as expected
  rescue:
    - name: "Record the rendering failure: {{ case_name }}"
      ansible.builtin.set_fact:
        case_outcome:
          name: "{{ case_name }}"
          ok: false
          detail: >-
            {{ ansible_failed_result.msg | default('(no message)') | trim }} --
            rendered config was: {{ rendered_config | default('(rendering itself
            failed)') | trim }}
  always:
    - name: "Add the outcome to the tally: {{ case_name }}"
      ansible.builtin.set_fact:
        molecule_case_results:
          "{{ molecule_case_results | default([]) + [case_outcome] }}"
