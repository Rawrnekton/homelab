---
# Run the input validation of the role with the vars of the include. Record if
# the validation rejects them for the correct reason.
#
# Caller contract:
#   case_name   - name of the case for the report
#   case_expect - text that must be in the rejection message
#   plus the k3s_* variables under test
#
# A case does not cause the play to fail. Each result goes into
# molecule_case_results. At the end of converge.yml, the report play fails one
# time with the full table. Without this, the first broken case hides all the
# subsequent cases.
- name: "Case: {{ case_name }}"
  block:
    - name: "Submit input: {{ case_name }}"
      ansible.builtin.include_role:
        name: k3s
        tasks_from: validate-variables.yml

    - name: "Record that the input passed validation: {{ case_name }}"
      ansible.builtin.set_fact:
        case_outcome:
          name: "{{ case_name }}"
          ok: false
          detail: validation accepted an input it must reject
  rescue:
    # ansible-lint renders this name without the vars of the caller, thus
    # case_expect is not defined for it. The include always sets it.
    - name: "Record how the input was rejected: {{ case_name }}" # noqa: jinja[invalid]
      vars:
        failure_message: "{{ ansible_failed_result.msg | default('') }}"
      ansible.builtin.set_fact:
        case_outcome:
          name: "{{ case_name }}"
          ok: "{{ case_expect in failure_message }}"
          detail: >-
            expected '{{ case_expect }}' in the rejection message, got: {{
            failure_message | trim }}
  always:
    - name: "Add the outcome to the tally: {{ case_name }}"
      ansible.builtin.set_fact:
        molecule_case_results:
          "{{ molecule_case_results | default([]) + [case_outcome] }}"
