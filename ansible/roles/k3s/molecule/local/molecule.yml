---
# Local scenario: all checks that need no node.
#
# This scenario has two parts, and they need no k3s installation:
#
#   1. The input contract of tasks/validate-variables.yml.
#   2. The result of templates/config.yaml.j2. This template changes ten of
#      the role variables into node state.
#
# It runs on the Ansible controller through the `default` driver. Thus there is
# no container to build, start or remove. This makes it the fastest scenario,
# and the correct first scenario in the fast group.
#
# The inventory has a second host, and no play runs on it. config.yaml.j2 reads
# the address and the join token of the bootstrap node from hostvars. The
# "joining node" cases need a bootstrap node for this.
dependency:
  name: galaxy
role_name_check: 2
driver:
  name: default
platforms:
  - name: localhost
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
          k3s-render-peer:
            ansible_connection: local
            ansible_default_ipv4:
              address: 10.10.0.1
            k3s_token: K10molecule::server:0000
verifier:
  name: ansible
scenario:
  # No create, prepare, destroy or idempotence, because nothing changes. Also no
  # verify: the assertions are in the converge, because a rejected input must
  # cause its play to fail.
  test_sequence:
    - syntax
    - converge
