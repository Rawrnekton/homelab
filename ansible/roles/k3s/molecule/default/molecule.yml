---
# Fast scenario: one control-plane node, no workers, Docker driver.
#
# Goal: fast feedback on the parts of the role that do not need more nodes:
# config templates, service state, a single-node cluster that starts, and
# idempotence. All values are role defaults. Feature variables go into the
# `features` scenario.
dependency:
  name: galaxy
role_name_check: 2
driver:
  name: docker
platforms:
  - name: k3s-single
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
  inventory:
    host_vars:
      k3s-single:
        k3s_node_role: control
        # overlayfs does not work inside a Docker container. Thus all Docker
        # scenarios use the native (copy-based) containerd snapshotter.
        k3s_snapshotter: native
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
