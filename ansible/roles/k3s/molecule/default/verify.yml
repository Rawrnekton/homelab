---
# Verify: single control-plane node on role defaults (molecule/default).
#
# Scope: only what a default converge must produce. Feature variables are
# verified in the `features`, `cilium`, `upgrade` and `uninstall` scenarios.
#
# molecule's built-in idempotence step already covers "does a second converge
# report changed=0" - no separate assertion needed here.
- name: Verify
  hosts: all
  become: true
  tasks:
    # -- Binary ---------------------------------------------------------
    - name: Check k3s binary is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Assert k3s binary exists and is executable
      ansible.builtin.assert:
        that:
          - k3s_binary.stat.exists
          - k3s_binary.stat.executable

    # -- Config file ----------------------------------------------------
    - name: Read rendered k3s config
      ansible.builtin.slurp:
        path: /etc/rancher/k3s/config.yaml
      register: k3s_config_raw

    - name: Assert config content matches a bootstrap node
      vars:
        k3s_config: "{{ k3s_config_raw['content'] | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'cluster-init: true' in k3s_config"
          - "'server:' not in k3s_config"
        fail_msg: "Rendered config.yaml does not match expected bootstrap-node shape:\n{{ k3s_config }}"

    - name: Check config file permissions
      ansible.builtin.stat:
        path: /etc/rancher/k3s/config.yaml
      register: k3s_config_stat

    - name: Assert config file is not world/group readable
      ansible.builtin.assert:
        that:
          - k3s_config_stat.stat.mode == '0600'

    # -- Service state --------------------------------------------------
    - name: Check k3s service state
      ansible.builtin.systemd:
        name: k3s
      register: k3s_service

    - name: Assert k3s service is enabled and running
      ansible.builtin.assert:
        that:
          - k3s_service.status.ActiveState == 'active'
          - k3s_service.status.UnitFileState == 'enabled'

    # -- Cluster readiness ----------------------------------------------
    # kubectl through `command`: kubernetes.core needs the python kubernetes
    # client on the target, which is not worth installing into every
    # test container just to read a node object.
    - name: Wait for the single node to report Ready
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: node_list
      changed_when: false
      until: "'Ready' in node_list.stdout"
      retries: 12
      delay: 5

    - name: Assert exactly one Ready node
      ansible.builtin.assert:
        that:
          - node_list.stdout_lines | length == 1
          - "'NotReady' not in node_list.stdout"

    # -- Node token -----------------------------------------------------
    - name: Check node token was generated
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/node-token
      register: node_token_file

    - name: Assert node token file exists
      ansible.builtin.assert:
        that:
          - node_token_file.stat.exists

    # -- Taints (none configured, so none expected) ---------------------
    #
    # Auto-tainting a control node when workers are present is NOT a feature
    # of this role. k3s_node_taints is a plain per-node list.
    - name: Read taints on the node
      ansible.builtin.command: >-
        k3s kubectl get node {{ inventory_hostname }}
        -o jsonpath={.spec.taints}
      register: node_taints
      changed_when: false

    - name: Assert no taint applied when none is configured
      ansible.builtin.assert:
        that:
          - node_taints.stdout | trim == '' or node_taints.stdout | trim == '[]'
        fail_msg: "Expected no taints on this node, got: {{ node_taints.stdout }}"

    # -- Storage default ------------------------------------------------
    #
    # k3s_local_path_provisioner_enabled defaults to false, so a default
    # converge must switch the k3s built-in off.
    - name: Assert local-storage is disabled by default
      vars:
        k3s_config: "{{ k3s_config_raw['content'] | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'local-storage' in k3s_config"
        fail_msg: >-
          k3s_local_path_provisioner_enabled is false by default, so config.yaml
          must disable the local-storage built-in. Rendered config:
          {{ k3s_config }}

    - name: List deployments in kube-system
      ansible.builtin.command: k3s kubectl get deployments -n kube-system -o name
      register: kube_system_deployments
      changed_when: false

    - name: Assert the local-path provisioner is not deployed by default
      ansible.builtin.assert:
        that:
          - "'local-path-provisioner' not in kube_system_deployments.stdout"
        fail_msg: >-
          local-path-provisioner is running although
          k3s_local_path_provisioner_enabled defaults to false.
