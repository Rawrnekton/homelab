---
# Workers scenario: one control-plane node, two workers.
#
# Goal: the agent half of the topology matrix - a single-server cluster that
# still takes agents, two agents joining the same server, and the agent-only
# variables (k3s_extra_agent_args, per-node labels on a worker).
dependency:
  name: galaxy
role_name_check: 2
driver:
  name: docker
platforms:
  - &node
    name: k3s-bootstrap
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    networks:
      - name: k3s-molecule-workers
    network_mode: k3s-molecule-workers
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    groups:
      - control
  - <<: *node
    name: k3s-worker1
    groups:
      - worker
  - <<: *node
    name: k3s-worker2
    groups:
      - worker
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
  inventory:
    group_vars:
      all:
        # overlayfs does not work nested inside Docker.
        k3s_snapshotter: native
      control:
        k3s_node_role: control
      worker:
        k3s_node_role: worker
        k3s_node_labels:
          - "molecule.test/from-list=true"
        # --node-label is a real k3s agent flag, so a pass-through argument
        # becomes visible on the node object. The key differs from the
        # k3s_node_labels one, so the two sources stay distinguishable.
        k3s_extra_agent_args:
          - "--node-label=molecule.test/from-agent-args=true"
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
