---
# Uninstall scenario: one control-plane node and one worker.
#
# Goal: k3s_state: absent removes k3s from both kinds of node. The server and
# the agent have different uninstall scripts, so both must be covered.
#
# The scenario installs first (converge), then removes (side_effect), then
# checks that nothing is left behind (verify).
dependency:
  name: galaxy
role_name_check: 2
driver:
  name: docker
platforms:
  - &node
    name: k3s-bootstrap
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /usr/lib/systemd/systemd
    networks:
      - name: k3s-molecule-uninstall
    network_mode: k3s-molecule-uninstall
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    groups:
      - control
  - <<: *node
    name: k3s-worker1
    groups:
      - worker
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
  inventory:
    group_vars:
      all:
        # overlayfs does not work nested inside Docker.
        k3s_snapshotter: native
      control:
        k3s_node_role: control
      worker:
        k3s_node_role: worker
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
