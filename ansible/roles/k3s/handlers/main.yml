---
# Rolling restart after a configuration change.
#
# `throttle: 1` comes from the v1.0.0 scope: the handler restarts one node at a
# time. But this is not a strict roll. The linear strategy of Ansible completes
# a task on all hosts before it starts the next task. Thus the readiness check
# below runs after all nodes got the restart. A strict roll needs `serial:` on
# the play, and a role cannot set it.
#
# The two handlers listen on the same topic. Thus one notify starts the two
# handlers, in the order of this file.
#
# The `when` prevents a restart on a first install. The install path starts the
# service itself, thus a second restart is not necessary. Also, a node that
# joins must not restart the nodes that run already. k3s_already_running is the
# state of this node BEFORE this run.
- name: Restart k3s
  listen: k3s configuration changed
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    state: restarted
  throttle: 1
  when: k3s_already_running | bool

- name: Wait for the k3s API to answer again
  listen: k3s configuration changed
  # tasks/install.yml tells why this is `k3s kubectl` and not a plain request to
  # /readyz.
  ansible.builtin.command: k3s kubectl get --raw /readyz
  register: k3s_readyz_after_restart
  changed_when: false
  until: k3s_readyz_after_restart is success
  retries: 30
  delay: 10
  throttle: 1
  when:
    - k3s_already_running | bool
    - k3s_node_role == 'control'
