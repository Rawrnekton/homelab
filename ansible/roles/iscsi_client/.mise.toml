[tasks.docs]
description = "Render role documentation into README.md"
run = "aar-doc --output-mode inject --output-file README.md . markdown"

# --- Molecule ---------------------------------------------------------------
#
# Every task goes through scripts/molecule-tally.sh, which runs the scenarios
# one after the other, keeps going when one fails, and prints a pass/fail table
# at the end. Its exit status is 0 only when every scenario passed.
#
# Sequential on purpose, and not only for the load: the LIO target the
# scenarios build lives in the kernel of the host, which every container
# shares. Two scenarios at once would see each other's targets.

[tasks.fast]
description = "Molecule: the local checks and one portal with two targets (fast group)"
dir = "{{ config_root }}"
run = "./scripts/molecule-tally.sh local default"

# Cheapest first, heaviest last, so a broken change shows up early.
[tasks.full]
description = "Molecule: every scenario (full group)"
dir = "{{ config_root }}"
run = "./scripts/molecule-tally.sh local default portals add-target"

[tasks.scenario]
description = "Molecule: run the named scenarios (mise run scenario portals add-target)"
dir = "{{ config_root }}"
run = "./scripts/molecule-tally.sh {{ arg(name='scenario', var=true) }}"
