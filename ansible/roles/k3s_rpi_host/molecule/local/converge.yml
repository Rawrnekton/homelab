---
# Converge: the input contract, checked on the controller.
#
# This scenario has no verify playbook on purpose. A rejected input must make
# the play that submits it fail, so the assertions live here, in the converge.
#
# Two helper task files hold the plumbing:
#   tasks/expect-rejected.yml - the input must fail, with case_expect in the message
#   tasks/expect-accepted.yml - the input must pass
# Both run tasks/validate.yml: the argument spec, then validate-variables.yml.
#
# Every case records its outcome in molecule_case_results, and the report play
# at the end fails once with the whole table. One broken rule must not hide
# the rules behind it.
- name: Verify the role rejects bad input
  hosts: localhost
  gather_facts: false
  tasks:
    # -- Shape: the argument spec ----------------------------------------
    - name: Reject a string instead of a parameter list
      ansible.builtin.include_tasks: tasks/expect-rejected.yml
      vars:
        case_name: k3s_rpi_host_cmdline_params is a string
        case_expect: k3s_rpi_host_cmdline_params must be a list
        k3s_rpi_host_cmdline_params: cgroup_enable=memory cgroup_memory=1

    - name: Reject a string instead of a line list
      ansible.builtin.include_tasks: tasks/expect-rejected.yml
      vars:
        case_name: k3s_rpi_host_config_lines is a string
        case_expect: k3s_rpi_host_config_lines must be a list
        k3s_rpi_host_config_lines: kernel=kernel8.img

    - name: Reject a word for the reboot switch
      ansible.builtin.include_tasks: tasks/expect-rejected.yml
      vars:
        case_name: k3s_rpi_host_reboot is a word
        case_expect: k3s_rpi_host_reboot
        k3s_rpi_host_reboot: later

    # -- Rules: validate-variables.yml ------------------------------------
    - name: Reject a parameter with a space
      ansible.builtin.include_tasks: tasks/expect-rejected.yml
      vars:
        case_name: two parameters in one item
        case_expect: must be one token
        k3s_rpi_host_cmdline_params:
          - cgroup_enable=memory cgroup_memory=1

    - name: Reject an empty parameter
      ansible.builtin.include_tasks: tasks/expect-rejected.yml
      vars:
        case_name: empty parameter
        case_expect: must be one token
        k3s_rpi_host_cmdline_params:
          - ""

    - name: Reject a duplicate parameter
      ansible.builtin.include_tasks: tasks/expect-rejected.yml
      vars:
        case_name: same parameter twice
        case_expect: may appear once
        k3s_rpi_host_cmdline_params:
          - cgroup_memory=1
          - cgroup_memory=1

    - name: Reject a section filter in the config lines
      ansible.builtin.include_tasks: tasks/expect-rejected.yml
      vars:
        case_name: config line is [pi5]
        case_expect: section filter
        k3s_rpi_host_config_lines:
          - "[pi5]"
          - kernel=kernel8.img

    - name: Reject two config lines in one item
      ansible.builtin.include_tasks: tasks/expect-rejected.yml
      vars:
        case_name: config line with a newline
        case_expect: one non-empty line
        k3s_rpi_host_config_lines:
          - "kernel=kernel8.img\narm_boost=1"

    - name: Reject an empty config line
      ansible.builtin.include_tasks: tasks/expect-rejected.yml
      vars:
        case_name: empty config line
        case_expect: one non-empty line
        k3s_rpi_host_config_lines:
          - ""

    # -- Valid shapes ------------------------------------------------------
    - name: Accept the defaults
      ansible.builtin.include_tasks: tasks/expect-accepted.yml
      vars:
        case_name: role defaults

    - name: Accept the argus values
      ansible.builtin.include_tasks: tasks/expect-accepted.yml
      vars:
        case_name: argus values
        k3s_rpi_host_cmdline_params:
          - cgroup_enable=memory
          - cgroup_memory=1
        k3s_rpi_host_config_lines:
          - kernel=kernel8.img
        k3s_rpi_host_reboot: false

    - name: Accept flags and comments
      ansible.builtin.include_tasks: tasks/expect-accepted.yml
      vars:
        case_name: parameter without a value, comment line
        k3s_rpi_host_cmdline_params:
          - quiet
        k3s_rpi_host_config_lines:
          - "# set by k3s_rpi_host"
          - dtparam=pciex1_gen=3

- name: Report the results
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Show the outcome of every case
      ansible.builtin.debug:
        msg:
          "{{ '%-4s  %s' | format('PASS' if item.ok | bool else 'FAIL',
          item.name) }}"
      loop: "{{ molecule_case_results }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert every case behaved as the contract says
      vars:
        failed_cases:
          "{{ molecule_case_results | selectattr('ok', 'falsy') | list }}"
      ansible.builtin.assert:
        that:
          - failed_cases | length == 0
        fail_msg: >-
          {{ failed_cases | length }} of {{ molecule_case_results | length }}
          cases failed: {% for case in failed_cases %} - {{ case.name }}: {{
          case.detail | trim }} {% endfor %}
        success_msg: >-
          All {{ molecule_case_results | length }} cases behaved as the contract
          says.
