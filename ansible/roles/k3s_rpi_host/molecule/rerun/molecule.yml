---
# Re-run scenario: the lists change after the first run.
#
# Goal: on a re-run with longer lists, a parameter that is already in the file
# (from the first run or from the image) is not added again, a new one is
# appended, and the config.txt block is replaced instead of growing a second
# block. side_effect.yml carries the second set of values.
dependency:
  name: galaxy
role_name_check: 2
driver:
  name: docker
platforms:
  # No systemd and no privileges: the role edits two files and nothing else.
  # The reboot cannot run in a container; every scenario switches it off.
  - name: k3s-rpi-host-rerun
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: sleep infinity
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
  inventory:
    group_vars:
      all:
        k3s_rpi_host_cmdline_params:
          - cgroup_enable=memory
          - cgroup_memory=1
        k3s_rpi_host_config_lines:
          - kernel=kernel8.img
        k3s_rpi_host_reboot: false
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
