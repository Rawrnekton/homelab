---
# Refusals scenario: the inputs the role must refuse on a host it already set
# up, because doing them would lose data.
#
# Goal: a smaller size does not shrink the volume, and a mountpoint with
# content is not mounted over (and gets no new volume). Both runs fail, and
# the host is the same afterwards. side_effect.yml submits the bad inputs and
# checks that each one fails; verify.yml checks that nothing changed.
dependency:
  name: galaxy
role_name_check: 2
driver:
  name: docker
platforms:
  # Privileged for the loop devices, device-mapper and mount. No systemd: the
  # role starts no service. See ../resources/prepare.yml for the host safety.
  - name: lvm-refusals
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: sleep infinity
    privileged: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
    cleanup: ../resources/cleanup.yml
  inventory:
    group_vars:
      all:
        molecule_disk_count: 1
        molecule_disk_size: 400M
        lvm_volume_groups:
          - vg: molecule_data
            devices:
              - /dev/molecule-disk0
        lvm_volumes:
          - vg: molecule_data
            lv: data
            size: 100m
            fstype: ext4
            mountpoint: /srv/data
verifier:
  name: ansible
