---
# Grow scenario: the shape of argo on Ubuntu noble, then a second run with
# larger sizes and one more disk.
#
# Goal: on the second run the volumes grow, the mounted ext4 grows with them
# online, the new disk joins the volume group, and the first disk stays in the
# group although the second run no longer lists it (remove_extra_pvs: false).
# side_effect.yml carries the second set of values.
dependency:
  name: galaxy
role_name_check: 2
driver:
  name: docker
platforms:
  # Privileged for the loop devices, device-mapper and mount. No systemd: the
  # role starts no service. See ../resources/prepare.yml for the host safety.
  - name: lvm-grow
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: sleep infinity
    privileged: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../.."
  playbooks:
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
    cleanup: ../resources/cleanup.yml
  inventory:
    group_vars:
      all:
        molecule_disk_count: 2
        molecule_disk_size: 400M
        # As group_vars/argo/lvm.yml: a volume with ext4 that the role does not
        # mount (root on argo, where the installer made the filesystem) and
        # one with ext4 mounted at /var/lib/longhorn.
        lvm_volume_groups:
          - vg: molecule_ubuntu-vg
            devices:
              - /dev/molecule-disk0
        lvm_volumes:
          - vg: molecule_ubuntu-vg
            lv: ubuntu-lv
            size: 100m
            fstype: ext4
          - vg: molecule_ubuntu-vg
            lv: longhorn-lv
            size: 100m
            fstype: ext4
            mountpoint: /var/lib/longhorn
verifier:
  name: ansible
