---
# The VPS: listens for the gateway and the road warriors, and relays between
# them.
wireguard_address: 10.0.0.1/24
wireguard_listen_port: 51820
wireguard_ip_forward: true

wireguard_peer_hosts:
  - host: odysseus
    allowed_ips:
      - 10.0.0.2/32

wireguard_peers:
  - name: laptop
    public_key: "{{ vault_wireguard_laptop_public_key }}"
    allowed_ips:
      - 10.0.0.3/32
