---
k3s_state: present # present (default) or absent

k3s_node_role: control # control (default) or worker

k3s_upgrade: false # set to true to force upgrades

k3s_cni: cilium
k3s_cilium_version: "1.20.2" # Cilium chart version
k3s_cilium_values:
  operator:
    replicas: 1
  # kube-proxy is off, so the agent cannot reach the API through a
  # service IP. It talks to the local API server instead.
  k8sServiceHost: 127.0.0.1
  k8sServicePort: 6443
  ipam:
    mode: kubernetes
k3s_kube_proxy_replacement: true # bool, cilium fully replaces kube-proxy

k3s_kubeconfig_fetch: true
k3s_kubeconfig_dest: ~/.kube/argus.yaml

k3s_sysctl_settings:
  fs.inotify.max_user_instances: 512
  fs.inotify.max_user_watches: 524288
