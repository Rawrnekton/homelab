---
# All services that this homelab exposes. dns (pihole) reads this list, and on
# the gateway, certbot and wireguard read it. After the ispconfig_proxy split,
# the vps play also reads it. Thus it is in `all`.

internal_ip_gateway: 192.168.2.170

# dns and the certbot cleanup read this value.
dns_domain_suffix: "cindergla.de"

services:
  - name: mealie
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: rancher
    dns_target: "{{ internal_ip_gateway }}"
  - name: homepage
    dns_target: "{{ internal_ip_gateway }}"
  - name: argocd
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: auth
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: todo
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: memories
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: copperforge
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: vorleser
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: fliederhof
    dns_target: "{{ internal_ip_gateway }}"
    is_external: false
  - name: whoami
    dns_target: "{{ internal_ip_gateway }}"
    is_external: false
  - name: zigbee2mqtt
    dns_target: "{{ internal_ip_gateway }}"
    is_external: false
  - name: garage
    dns_target: "{{ internal_ip_gateway }}"
    is_external: false
  - name: yopass
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
