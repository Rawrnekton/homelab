---
# Every service this homelab exposes. Read by dns (pihole), and by certbot and
# wireguard on the gateway. The vps play reads it once the ispconfig_proxy
# split lands, which is why it lives in `all`.

# TODO: change this to always point to first gateway
internal_ip_gateway: 192.168.2.170

# Read by dns and by the certbot cleanup.
dns_domain_suffix: "cindergla.de"

services:
  - name: mealie
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: rancher
    dns_target: "{{ internal_ip_gateway }}"
  - name: homepage
    dns_target: "{{ internal_ip_gateway }}"
  - name: argocd
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: auth
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: todo
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: memories
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: copperforge
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: vorleser
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
  - name: fliederhof
    dns_target: "{{ internal_ip_gateway }}"
    is_external: false
  - name: whoami
    dns_target: "{{ internal_ip_gateway }}"
    is_external: false
  - name: zigbee2mqtt
    dns_target: "{{ internal_ip_gateway }}"
    is_external: false
  - name: garage
    dns_target: "{{ internal_ip_gateway }}"
    is_external: false
  - name: yopass
    dns_target: "{{ internal_ip_gateway }}"
    is_external: true
