---
# The ISPConfig panel runs on this host; the role talks to it locally.
ispconfig_proxy_api_url: https://admin.cindergla.de/remote/json.php
ispconfig_proxy_username: "{{ vault_ispconfig_proxy_username }}"
ispconfig_proxy_password: "{{ vault_ispconfig_proxy_password }}"

# Where the vhost proxies to: the tunnel address of the gateway (odysseus),
# which terminates TLS for every service. Written down here on purpose, not
# derived from the wireguard variables.
ispconfig_proxy_upstream: https://10.0.0.2/
