---
- name: Install Base Configuration
  hosts: homelab
  become: true
  roles:
    - { role: common, tags: [common] }

- name: Setup gateway for proxying and TLS termination
  hosts: gateway
  become: true
  roles:
    - { role: haproxy, tags: [haproxy] }
    - { role: certbot, tags: [certbot] }
    - { role: iscsi-client, tags: [iscsi-client] }
    - { role: garage, tags: [garage] }

- name: Setup WireGuard tunnel between gateway and VPS
  hosts: gateway:vps
  become: true
  roles:
    - { role: wireguard, tags: [wireguard] }

- name: Setup DNS records for services
  hosts: dns
  become: true
  roles:
    - { role: dns, tags: [dns] }

- name: Provision argo Cluster
  hosts: argo
  become: true
  roles:
    - { role: lvm, tags: [lvm] }
    - { role: k3s, tags: [k3s] }
    - { role: longhorn_requirements, tags: [longhorn_requirements] }

- name: Prepare the boot of the Raspberry Pis that run k3s
  hosts: k3s_rpi_host
  become: true
  roles:
    - { role: k3s_rpi_host, tags: [k3s_rpi_host] }

- name: Prepare the storage of the monitoring host
  hosts: monitoring
  become: true
  roles:
    - { role: lvm, tags: [lvm] }
